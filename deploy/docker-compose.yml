# 单机部署：全部服务运行在一台机器上，只有 web（nginx）发布端口（80、443）。
#
# 在仓库根目录执行（先用 ./deploy/build.sh 生成后端 jar 和前端 dist）：
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
#
# 设计见 docs/01-product/specs/F-17-deployment.md
name: docagent

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *defaults
    build:
      context: ../web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
    depends_on:
      - api
      - collab-server

  # 签发和续期 Let's Encrypt 的 IP 证书；web 发现证书后自动切到 HTTPS
  certbot:
    <<: *defaults
    image: certbot/certbot:v5.9.0
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-loop.sh"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
    volumes:
      - ./certbot.sh:/usr/local/bin/certbot-loop.sh:ro
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    depends_on:
      - web

  api:
    <<: *defaults
    build:
      context: ../api
    # 整份 .env 交给后端；下面只写容器内外不同的值，以及必须和其他服务一致的账号密码
    env_file: ../.env
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:MaxMetaspaceSize=256m
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      # 表结构脚本 api/mysql-schema.sql 固定使用 docagent 库
      MYSQL_DATABASE: docagent
      MYSQL_USERNAME: ${MYSQL_USERNAME:-docagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-docagent}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-docagentadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COLLAB_URL: http://collab-server:1234
      COLLAB_AI_SECRET: ${COLLAB_AI_SECRET:?COLLAB_AI_SECRET is required}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      LOG_FILE: /app/logs/docAgent.log
    volumes:
      - api-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  collab-server:
    <<: *defaults
    build:
      context: ../collab-server
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    environment:
      SPRING_URL: http://api:8080
      COLLAB_AI_SECRET: ${COLLAB_AI_SECRET:?COLLAB_AI_SECRET is required}
    depends_on:
      - api

  mysql:
    <<: *defaults
    image: mysql:8.0
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: docagent
      MYSQL_USER: ${MYSQL_USERNAME:-docagent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --performance-schema=OFF
      - --max-connections=100
      - --innodb-buffer-pool-size=128M
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据卷为空（首次启动）时执行
      - ../api/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./demo-users.sql:/docker-entrypoint-initdb.d/02-demo-users.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    <<: *defaults
    image: rabbitmq:4.3-management
    # 数据目录按节点名区分，固定 hostname 才能在容器重建后沿用原来的数据
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-docagent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    <<: *defaults
    # MinIO 官方镜像已不在 Docker Hub 发布，使用社区维护的构建
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-docagentadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data

volumes:
  letsencrypt:
  acme-webroot:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  api-logs:
