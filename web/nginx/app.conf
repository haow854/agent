# 应用本身的路由，HTTP 和 HTTPS 两套配置的 server 块都 include 这一份。
# 路由设计见 docs/01-product/specs/F-17-deployment.md

root /usr/share/nginx/html;
index index.html;

client_max_body_size 100m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# 上游写成变量，由 Docker 内置 DNS 在请求时解析：后端容器重建换了 IP 也不用重启 nginx
resolver 127.0.0.11 valid=10s ipv6=off;
set $api http://api:8080;
set $collab http://collab-server:1234;

location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# Agent 进度推送：STOMP over WebSocket，登录校验在 STOMP 的 CONNECT 帧上
location /ws/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

# 协同编辑的 WebSocket。只代理这一个路径：协同服务的 /ai/* 只供后端在内网调用
location = /collab {
    rewrite ^ / break;
    proxy_pass $collab;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
}

# 构建产物文件名带 hash，可以长期缓存
location /assets/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# 前端使用 history 路由，未匹配到文件的路径都交给 index.html
location / {
    try_files $uri $uri/ /index.html;
}
