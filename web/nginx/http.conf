# 还没有证书时用这一套：80 端口直接提供整个应用。
# 本地运行完整环境、服务器首次部署证书签下来之前，都是这一套。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt 的验证文件，certbot 写进共享卷
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    include /etc/nginx/docagent/app.conf;
}
