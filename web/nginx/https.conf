# 有证书时用这一套：443 提供整个应用，80 只留给证书验证，其余跳到 https。
# 不开 HSTS：证书只有 6 天有效，续期出问题时用户还能手动继续访问。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Let's Encrypt 的验证文件，certbot 写进共享卷；续期也走这里
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/docagent/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docagent/privkey.pem;

    include /etc/nginx/docagent/app.conf;
}
